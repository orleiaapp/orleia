# Builds the Orleia desktop app for Windows, macOS and Linux.
#
# Triggered by a version tag (e.g. v1.14.0) or manually via the Actions tab.
# Each runner builds its own platform (macOS apps must be built on macOS,
# which is why this uses a matrix instead of one machine).
# The installers are unsigned: Windows shows a SmartScreen "More info > Run
# anyway" prompt, macOS requires right-click > Open. This is the free path.

name: Build Desktop Apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: orleia-windows
          - os: macos-latest
            artifact: orleia-macos
          - os: ubuntu-latest
            artifact: orleia-linux
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Build ${{ matrix.os }}
        working-directory: desktop
        run: npx electron-builder --${{ matrix.os == 'windows-latest' && 'win' || (matrix.os == 'macos-latest' && 'mac' || 'linux') }}

      - name: Upload ${{ matrix.os }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach installers to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
          generate_release_notes: true

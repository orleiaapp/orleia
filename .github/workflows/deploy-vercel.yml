# Ship pipeline for Orleia — verify before deploy.
#
# Push to master  ->  verify (typecheck + i18n parity tests + production
# build)  ->  deploy to Vercel production. Manual runs via workflow_dispatch.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   VERCEL_TOKEN       - create one at https://vercel.com/account/tokens
#   VERCEL_ORG_ID      - the "orgId" value in .vercel/project.json
#   VERCEL_PROJECT_ID  - the "projectId" value in .vercel/project.json
# Note: .vercel/ is gitignored, so the CI checkout has no local project
# link — the org/project ids MUST come from secrets, and runtime env vars
# (e.g. NVIDIA_API_KEY) live in the Vercel dashboard, injected only when
# the serverless functions run. The BUILD itself needs no env vars:
# `next build` passes with no .env file at all.
#
# The local ship loop in AGENTS.md (`vercel --prod --yes`) also deploys
# from this machine; both paths are idempotent, and this workflow is the
# safety net when a push happens without that loop (other machines, edits
# straight on GitHub).

name: Verify and deploy to Vercel

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Tests (translation key parity across all 10 languages)
        run: npm test

      - name: Production build
        run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel deploy --prod --yes --token "$VERCEL_TOKEN"
